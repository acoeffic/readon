<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexDay</title>
<style>
  body {
    margin: 0;
    background: #F0E8D8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .card {
    background: #FAF3E8;
    border-radius: 16px;
    padding: 48px 32px;
    max-width: 380px;
    margin: 16px;
    border: 1px solid rgba(107,152,141,0.15);
  }
  h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin: 20px 0 8px; }
  p  { font-size: 14px; color: #777; margin: 0 0 28px; line-height: 1.6; }
  .btn {
    display: inline-block;
    background: #6B988D;
    color: #FAF3E8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 36px;
    border-radius: 50px;
  }
  .store {
    display: block;
    margin-top: 16px;
    font-size: 13px;
    color: #6B988D;
    text-decoration: none;
  }
  img.logo { width: 48px; height: 48px; border-radius: 10px; }
  #ref { display: none; margin-top: 24px; }
  #ref .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #1a1a1a;
    background: rgba(107,152,141,0.10);
    border: 1px dashed rgba(107,152,141,0.45);
    border-radius: 12px;
    padding: 14px 18px;
  }
  #ref .hint { font-size: 13px; color: #777; margin: 12px 0 0; line-height: 1.5; }
  #copy {
    margin-top: 12px;
    background: none;
    border: 1px solid rgba(107,152,141,0.45);
    color: #6B988D;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="https://nzbhmshkcwudzydeahrq.supabase.co/storage/v1/object/public/asset/email/logo.png" alt="LexDay">
  <h1>Ouverture de LexDay…</h1>
  <p>Si l'application ne s'ouvre pas automatiquement, appuie sur le bouton ci-dessous.</p>
  <a id="open" class="btn" href="#">Ouvrir LexDay</a>
  <a id="store" class="store" href="#" hidden>Télécharger l'application</a>

  <!-- Parrainage : filet de sécurité quand l'app n'est pas encore installée.
       Android récupère le code automatiquement via le Play Install Referrer ;
       iOS n'a aucun équivalent, d'où le code affiché en clair à recopier. -->
  <div id="ref">
    <div class="code" id="refcode"></div>
    <button id="copy" type="button">Copier le code</button>
    <p class="hint" id="refhint"></p>
  </div>
</div>

<script>
(function () {
  var PACKAGE = 'com.acoeffic.lexday';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE;

  // Cible : ?to=friends/requests → lexday://friends/requests
  // Whitelist stricte des caractères pour éviter toute injection dans
  // l'URL intent:// (l'app ignore de toute façon les hosts inconnus).
  var params = new URLSearchParams(location.search);
  var to = params.get('to') || 'feed';
  if (!/^[a-zA-Z0-9/_-]+$/.test(to)) to = 'feed';

  // Parrainage : /r/ABC123 est réécrit en ?to=referral&code=ABC123 (voir
  // vercel.json). Le code voyage dans un paramètre dédié plutôt que dans
  // `to`, dont la whitelist interdit '?' et '=' — l'y glisser le ferait
  // silencieusement retomber sur 'feed'.
  var query = '';
  var code = '';
  if (to === 'referral') {
    code = (params.get('code') || '').toUpperCase();
    if (/^[A-Z0-9]{4,16}$/.test(code)) {
      query = '?code=' + code;
    } else {
      to = 'feed';
    }
  }

  var isAndroid = /android/i.test(navigator.userAgent);

  // URL Play Store, avec le referrer quand il s'agit d'un parrainage. Elle
  // sert à DEUX endroits : le `browser_fallback_url` de l'intent:// (chemin
  // automatique si l'app n'est pas installée) et le lien « Télécharger »
  // visible. Oublier le premier ferait perdre le code dans le cas le plus
  // fréquent.
  var playUrl = query
    ? PLAY_URL + '&referrer=' + encodeURIComponent('code=' + code)
    : PLAY_URL;

  var appUrl;
  if (isAndroid) {
    // intent:// : contrairement à lexday://, Chrome Android l'accepte même
    // en redirection automatique, et bascule sur browser_fallback_url
    // (Play Store) si l'app n'est pas installée.
    appUrl = 'intent://' + to + query + '#Intent'
      + ';scheme=lexday'
      + ';package=' + PACKAGE
      + ';S.browser_fallback_url=' + encodeURIComponent(playUrl)
      + ';end';
  } else {
    appUrl = 'lexday://' + to + query;
  }

  var openBtn = document.getElementById('open');
  openBtn.href = appUrl;

  // Lien store visible sur les DEUX plateformes. Il n'était affiché que sur
  // Android : un destinataire iOS sans l'app tombait sur un bouton « Ouvrir
  // LexDay » sans effet, et repartait. Or tous les partages sortants pointent
  // désormais ici.
  var storeLink = document.getElementById('store');
  storeLink.href = isAndroid
    ? playUrl
    : 'https://apps.apple.com/fr/app/lexday/id6760492023';
  storeLink.hidden = false;

  // Play Install Referrer : le paramètre `referrer` de playUrl survit à
  // l'installation et sera lu au premier lancement (cf. ReferralService).
  // C'est le seul mécanisme d'attribution différée officiel et gratuit.

  // iOS (et desktop) : pas d'attribution différée possible. On affiche le code
  // pour que le filleul puisse le saisir après installation.
  if (query && !isAndroid) {
    document.getElementById('refcode').textContent = code;
    document.getElementById('refhint').textContent =
      "Note ce code : tu pourras le saisir dans LexDay, dans Réglages › Parrainage, pour que vous receviez chacun 14 jours offerts.";
    document.getElementById('ref').style.display = 'block';

    document.getElementById('copy').addEventListener('click', function () {
      var btn = this;
      var done = function () { btn.textContent = 'Code copié ✓'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () {});
      } else {
        var t = document.createElement('textarea');
        t.value = code;
        document.body.appendChild(t);
        t.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(t);
      }
    });
  }

  // Tentative automatique. Sur iOS/desktop un échec est silencieux (le
  // bouton reste le filet de sécurité) ; sur Android l'intent:// gère
  // lui-même le fallback Play Store.
  setTimeout(function () { location.href = appUrl; }, 100);
})();
</script>
</body>
</html>
